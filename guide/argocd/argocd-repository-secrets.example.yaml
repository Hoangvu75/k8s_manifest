# Mẫu đặt trong repo PRIVATE k8s_manifest_secrets (KHÔNG commit PAT vào k8s_manifest).
# Đổi <GITHUB_USERNAME> và <GITHUB_PAT_MỚI> sau khi đã thu hồi token cũ và tạo PAT mới.
# Application "secrets" (bootstrap) sync path "." — có thể đặt file này ở root hoặc argocd/ tùy bạn.
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-github-k8s-manifest
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/Hoangvu75/k8s_manifest.git
  username: "Hoangvu75"
  password: "GITHUB_PAT"
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-github-k8s-manifest-secrets
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/Hoangvu75/k8s_manifest_secrets.git
  username: "Hoangvu75"
  password: "GITHUB_PAT"
