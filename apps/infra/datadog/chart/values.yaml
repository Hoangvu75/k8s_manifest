datadog:
  apiKeyExistingSecret: datadog-key
  site: us5.datadoghq.com
  clusterName: playground

  # Tag cardinality cho check K8s — giúp Explorer/orchestrator có đủ tag (tăng nhẹ cardinality).
  checksCardinality: orchestrator

  orchestratorExplorer:
    enabled: true
    # Tắt scrubbing giảm CPU/RAM khi thu thập orchestrator — cluster nhỏ hay PARTIAL có thể đỡ hơn.
    container_scrubbing:
      enabled: false

  kubeStateMetricsCore:
    enabled: true
    rbac:
      create: true

  logs:
    enabled: true
    containerCollectAll: false

  apm:
    socketEnabled: false
    portEnabled: true

  processAgent:
    enabled: true
    processCollection: true
    containerCollection: true

clusterAgent:
  enabled: true
  replicas: 1
  env:
    # Đồng bộ rõ ràng với node agent (tránh UI báo Orchestrator PARTIAL khi env thiếu).
    - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
      value: "true"

agents:
  containers:
    agent:
      env:
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 768Mi
    traceAgent:
      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
    processAgent:
      env:
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
