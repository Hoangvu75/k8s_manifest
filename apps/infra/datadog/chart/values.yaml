datadog:
  apiKeyExistingSecret: datadog-key
  site: us5.datadoghq.com
  clusterName: playground

  # Kind / Docker Desktop (WSL2): kubelet dùng cert không verify được mặc định → check kubelet + orchestrator_pod fail,
  # Explorer không có pod đa namespace. Prod có CA kubelet riêng nên bật lại tlsVerify: true.
  kubelet:
    tlsVerify: false

  # Chart mặc định bật Operator kèm DaemonSet — tắt nếu chỉ dùng Helm (tránh xung đột, dễ lỗi orchestrator).
  operator:
    enabled: false

  # Tag cardinality cho check K8s — giúp Explorer/orchestrator có đủ tag (tăng nhẹ cardinality).
  checksCardinality: orchestrator

  orchestratorExplorer:
    enabled: true
    # Tắt scrubbing giảm CPU/RAM khi thu thập orchestrator — cluster nhỏ hay PARTIAL có thể đỡ hơn.
    container_scrubbing:
      enabled: false

  kubeStateMetricsCore:
    enabled: true
    rbac:
      create: true

  logs:
    enabled: true
    containerCollectAll: false

  apm:
    socketEnabled: false
    portEnabled: true

  processAgent:
    enabled: true
    processCollection: true
    containerCollection: true

clusterAgent:
  enabled: true
  replicas: 1
  image:
    tag: "7.77.1"
  env:
    # Bắt buộc khớp site US5 — nếu Cluster Agent gửi nhầm orchestrator.api.datadoghq.com sẽ 404 / PARTIAL.
    - name: DD_SITE
      value: "us5.datadoghq.com"
    - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
      value: "true"

agents:
  image:
    tag: "7.77.1"
  containers:
    agent:
      env:
        - name: DD_SITE
          value: "us5.datadoghq.com"
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 768Mi
    traceAgent:
      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
    processAgent:
      env:
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
