datadog:
  apiKeyExistingSecret: datadog-key
  site: us5.datadoghq.com
  clusterName: playground

  kubelet:
    tlsVerify: false

  operator:
    enabled: false

  checksCardinality: orchestrator

  orchestratorExplorer:
    enabled: true
    container_scrubbing:
      enabled: true

  kubeStateMetricsCore:
    enabled: true
    rbac:
      create: true

  logs:
    enabled: true
    containerCollectAll: true

  apm:
    socketEnabled: true
    portEnabled: true
  # OTLP env vars are set directly via agents.containers.agent.env below

  # Prometheus scraping for Traefik metrics
  prometheusScrape:
    enabled: true
    serviceEndpoints: true

  processAgent:
    enabled: true
    processCollection: true
    containerCollection: true

clusterAgent:
  enabled: true
  replicas: 1
  image:
    tag: "7.77.1"
  env:
    - name: DD_SITE
      value: "us5.datadoghq.com"
    - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
      value: "true"

agents:
  image:
    tag: "7.77.1"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  containers:
    agent:
      env:
        - name: DD_SITE
          value: "us5.datadoghq.com"
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENABLED
          value: "true"
        - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_GRPC_ENABLED
          value: "true"
      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          memory: 768Mi
    traceAgent:
      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
    processAgent:
      env:
        - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
          value: "true"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
