apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: gha-runner-scale-set
    repo: oci://ghcr.io/actions/actions-runner-controller-charts
    releaseName: arc-runner-set
    namespace: arc-runners
    version: "0.14.1"
    valuesInline:
      githubConfigUrl: $(REPO_URL)
      githubConfigSecret: arc-github-config
      minRunners: 0
      maxRunners: 5
      runnerScaleSetName: arc-runner-set
      controllerServiceAccount:
        namespace: arc-systems
        name: arc-gha-rs-controller
      containerMode:
        type: "dind"
      template:
        spec:
          containers:
            - name: runner
              image: ghcr.io/actions/actions-runner:latest
              command: ["/home/runner/run.sh"]
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 4Gi

vars:
  - name: REPO_URL
    objref:
      kind: ConfigMap
      name: repo-config
      apiVersion: v1
    fieldref:
      fieldpath: data.url
