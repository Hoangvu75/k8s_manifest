# profile: ambient  -> bật chế độ Ambient Mesh (ztunnel + waypoint), KHÔNG dùng sidecar.
# Đây là công tắc quan trọng nhất cho hướng bạn chọn.
profile: ambient

meshConfig:
  # In access log ra stdout của ztunnel/waypoint -> dễ quan sát khi học.
  accessLogFile: /dev/stdout

  # --- Tracing sang Datadog (TÙY CHỌN) ---
  # Bật khi Datadog Agent đã mở OTLP ingest (port 4317 gRPC). Chưa chắc chắn thì để nguyên comment
  # để tránh làm hỏng lần sync đầu.
  # extensionProviders:
  #   - name: datadog-otel
  #     opentelemetry:
  #       service: datadog.datadog.svc.cluster.local
  #       port: 4317
  # Sau đó tạo 1 resource Telemetry (xem apps/infra/istio-demo) để kích hoạt provider này.

pilot:
  # Homelab -> để nhẹ. Chỉnh theo tài nguyên node của bạn.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
