---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status", "nodes/stats"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/healthz", "/livez", "/readyz", "/version"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agent
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: ai-agent
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: ai-agent
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: ai-agent
          image: ghcr.io/hoangvu75/ai-agent:latest
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: DEEPSEEK_API_KEY
            - name: DEEPSEEK_BASE_URL
              value: "https://api.deepseek.com/v1"
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: DEEPSEEK_API_KEY
            - name: ANTHROPIC_BASE_URL
              value: "https://api.deepseek.com/anthropic"
            - name: ANTHROPIC_MODEL
              value: "deepseek-v4-flash"
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: "deepseek-v4-flash"
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: "deepseek-v4-flash"
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: "deepseek-v4-flash"
            - name: CLAUDE_CODE_SUBAGENT_MODEL
              value: "deepseek-v4-flash"
            - name: CLAUDE_CODE_EFFORT_LEVEL
              value: "max"
            - name: KUBECONFIG
              value: /root/.kube/config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
