apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: kong
  repo: https://charts.konghq.com
  releaseName: kong
  namespace: kong-gateway
  version: "2.45.0"
  valuesFile: values.yaml

resources:
  - httproute-kong.yaml
  - plugins
  - consumers
  - ingress
  - services
