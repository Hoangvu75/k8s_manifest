# Kong Gateway — DB-less mode
# Traffic: Cloudflare → Traefik → Kong (key-auth) → hello-api

fullnameOverride: "kong"

# Kong Ingress Controller — manages Kong config via Kubernetes CRDs
ingressController:
  installCRDs: true
  image:
    repository: ghcr.io/hoangvu75/kubernetes-ingress-controller
    tag: "3.3"

image:
  repository: ghcr.io/hoangvu75/kong
  tag: "3.9.1-ubuntu"
  pullSecrets:
    - registry-credentials

env:
  database: "off"

# Proxy service (Traefik routes here)
proxy:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: false

# Admin API — disable for production (can enable temporarily for testing)
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001

enterprise:
  enabled: false
