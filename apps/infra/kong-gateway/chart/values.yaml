
fullnameOverride: "kong"

ingressController:
  installCRDs: true
  image:
    repository: ghcr.io/hoangvu75/kubernetes-ingress-controller
    tag: "3.3"

image:
  repository: ghcr.io/hoangvu75/kong
  tag: "3.9.1-ubuntu"
  pullSecrets:
    - registry-credentials

env:
  database: "off"
  trusted_ips: "0.0.0.0/0, ::/0"

proxy:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: false

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001

enterprise:
  enabled: false
