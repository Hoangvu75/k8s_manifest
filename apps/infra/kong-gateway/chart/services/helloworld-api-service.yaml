---
apiVersion: v1
kind: Service
metadata:
  name: helloworld-api
  namespace: kong-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Bắt Kong gửi Host = FQDN thật khi proxy upstream (mặc định Kong giữ Host gốc "traefik.gateway-api...").
    # Nhờ vậy sidecar Kong route theo :authority khớp service helloworld-api -> đi vào cluster ĐÚNG (không
    # rơi vào PassthroughCluster) -> áp được mTLS + danh tính sa/kong -> AuthorizationPolicy cho qua.
    konghq.com/host-header: "helloworld-api.helloworld-api.svc.cluster.local"
spec:
  type: ExternalName
  externalName: helloworld-api.helloworld-api.svc.cluster.local
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: helloworld-api-mtls
  namespace: kong-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Kong resolve ExternalName rồi nối tới HOST THẬT -> DR phải đặt trên host thật này (không phải tên ExternalName).
  # Vì ExternalName khiến Istio coi host này là "external" nên auto-mTLS không tự áp -> ISTIO_MUTUAL ép lại mTLS.
  host: helloworld-api.helloworld-api.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
