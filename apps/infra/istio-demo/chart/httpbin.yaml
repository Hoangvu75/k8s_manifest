# Service "đích" để test. Pod trong ns istio-demo (istio-injection=enabled) được tiêm sidecar Envoy,
# tự động có mTLS giữa các pod + enforce AuthorizationPolicy ngay tại sidecar (không cần waypoint).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: istio-demo
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: istio-demo
  labels:
    app: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: istio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: ghcr.io/mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
