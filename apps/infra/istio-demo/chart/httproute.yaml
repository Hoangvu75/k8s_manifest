# Expose httpbin ra ngoài QUA ISTIO INGRESS (không qua Traefik) để test path north-south mới.
# parentRefs trỏ tới Gateway "istio-ingress" (apps/infra/istio-ingress), KHÔNG phải shared-gateway.
# => Bạn kiểm tra được Istio ingress hoạt động mà không đụng gì tới traffic đang chạy qua Traefik.
#
# LƯU Ý: hostname httpbin.hoangvu75.space cần được route tới cluster. Trong lúc học, cách nhanh nhất:
#   kubectl -n gateway-api port-forward svc/istio-ingress-istio 8443:443
#   curl -k --resolve httpbin.hoangvu75.space:8443:127.0.0.1 https://httpbin.hoangvu75.space:8443/get
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: istio-demo
spec:
  parentRefs:
    - name: istio-ingress
      namespace: gateway-api
  hostnames:
    - "httpbin.hoangvu75.space"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin
          port: 8000
