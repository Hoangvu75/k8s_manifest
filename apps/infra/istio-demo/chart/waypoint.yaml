# Waypoint proxy — trong Ambient, đây là chỗ xử lý policy L7 (HTTP method/path, retry, ...).
# Khác sidecar: 1 waypoint phục vụ cả namespace/service, không phải mỗi pod một cái.
# gatewayClassName: istio-waypoint  -> istiod tự deploy Envoy waypoint.
# Service httpbin đã trỏ vào nó qua annotation istio.io/use-waypoint: waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: istio-demo
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
