# Bài học bảo mật: chỉ cho phép định danh "demo-client" gọi httpbin, và chỉ method GET.
# Sidecar mode: Envoy tiêm trong pod httpbin enforce cả L4 (principal) lẫn L7 (method) — không cần waypoint.
#  - from.source.principals: định danh mTLS (SPIFFE), có được nhờ sidecar tự làm mTLS.
#
# Thử nghiệm (sau khi restart pod để có sidecar):
#   ALLOW: kubectl -n istio-demo exec deploy/demo-client -- curl -s -o /dev/null -w "%{http_code}\n" httpbin:8000/get   -> 200
#   DENY : kubectl -n istio-demo exec deploy/demo-client -- curl -s -o /dev/null -w "%{http_code}\n" -X POST httpbin:8000/post -> 403
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: httpbin-allow-client-get
  namespace: istio-demo
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-demo/sa/demo-client"
      to:
        - operation:
            methods: ["GET"]
