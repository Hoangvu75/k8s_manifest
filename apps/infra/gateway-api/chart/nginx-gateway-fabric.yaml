# NGINX Gateway Fabric - simplified deployment
# Full installation should be done using the official installation method
# This is a placeholder to satisfy dependencies
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway-fabric
  namespace: gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway-fabric
  template:
    metadata:
      labels:
        app: nginx-gateway-fabric
    spec:
      containers:
      - name: nginx-gateway-fabric
        image: nginx/nginx-gateway-fabric:v0.8.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-fabric
  namespace: gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app: nginx-gateway-fabric
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443