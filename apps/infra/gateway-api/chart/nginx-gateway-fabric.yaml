# NGINX Gateway Fabric - simplified deployment using official image
# This uses the correct image registry that should be accessible
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway-fabric
  namespace: gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway-fabric
  template:
    metadata:
      labels:
        app: nginx-gateway-fabric
    spec:
      containers:
      - name: nginx-gateway-fabric
        image: ghcr.io/nginxinc/nginx-gateway-fabric:latest
        imagePullPolicy: IfNotPresent
        args:
          - static-mode
          - --gateway-ctlr-name=gateway.nginx.org/gateway-controller
          - --gatewayclass=nginx
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-fabric
  namespace: gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: NodePort
  selector:
    app: nginx-gateway-fabric
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443