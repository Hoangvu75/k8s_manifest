# nginx-gateway-fabric values
# Deploys nginx-gateway-fabric controller with NodePort service

nginxGateway:
  image:
    repository: nginx/nginx-gateway-fabric
    tag: v0.8.0
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    nodePort: 30080
    
  config:
    logLevel: info
    
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi