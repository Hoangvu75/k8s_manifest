# Traefik Static Configuration (ConfigMap)
# Mounted into the Traefik Deployment via --configfile /etc/traefik/traefik.yaml
# All CLI args have been migrated here for clean management of complex configurations.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: gateway-api
data:
  traefik.yaml: |
    # =========================================================================
    # Traefik v3 Static Configuration
    # =========================================================================

    # --- API & Dashboard ---
    api:
      insecure: true

    # --- Providers ---
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesGateway: {}

    # --- EntryPoints ---
    entryPoints:
      web:
        address: ":80"
      websecure:
        address: ":443"
      tcp:
        address: ":9000"
      udp:
        address: ":9001/udp"
      metrics:
        address: ":9082"

    # --- Prometheus Metrics ---
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addServicesLabels: true

    # --- Access Logs (JSON format, ingested by Datadog) ---
    accessLog:
      format: json
      filters:
        statusCodes: ["200-499"]
      fields:
        defaultMode: keep

    # --- Distributed Tracing (OpenTelemetry via OTLP HTTP to Datadog APM) ---
    tracing:
      otlp:
        http:
          endpoint: http://datadog-agent.datadog:4318/v1/traces

    # --- Log Level ---
    log:
      level: INFO
