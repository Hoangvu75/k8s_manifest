---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-qoder
  namespace: ai-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agent-qoder
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status", "nodes/stats"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/healthz", "/livez", "/readyz", "/version"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-qoder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agent-qoder
subjects:
  - kind: ServiceAccount
    name: ai-agent-qoder
    namespace: ai-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-qoder
  namespace: ai-agent
  labels:
    app: ai-agent-qoder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent-qoder
  template:
    metadata:
      labels:
        app: ai-agent-qoder
    spec:
      serviceAccountName: ai-agent-qoder
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: ai-agent
          image: ghcr.io/hoangvu75/ai-agent-qoder:202605231050
          stdin: true
          tty: true
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
