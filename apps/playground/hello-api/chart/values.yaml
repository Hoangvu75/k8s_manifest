applicationName: hello-api

deployment:
  enabled: true
  replicas: 1
  image:
    repository: hashicorp/http-echo
    tag: "1.0"
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 5678
  args:
    - -text="Hello World"
    - -listen=:5678
  resources:
    limits:
      cpu: 50m
      memory: 32Mi
    requests:
      cpu: 10m
      memory: 16Mi

service:
  enabled: true
  ports:
    - name: http
      port: 5678
      targetPort: 5678

httpRoute:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: gateway-api
  hostnames:
    - test.hoangvu75.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /helloworld
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: hello-api
          port: 5678
