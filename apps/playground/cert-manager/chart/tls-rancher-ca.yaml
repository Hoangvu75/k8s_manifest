apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: tls-rancher-selfsigned
  namespace: cattle-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-rancher
  namespace: cattle-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  isCA: true
  secretName: tls-rancher
  commonName: tls-rancher-ca
  duration: 87600h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: tls-rancher-selfsigned
    kind: Issuer
    group: cert-manager.io
