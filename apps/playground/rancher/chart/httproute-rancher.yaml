httpRoute:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: gateway-api
  hostnames:
    - "rancher.hoangvu75.space"
    - "rancher.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rancher
          port: 80
