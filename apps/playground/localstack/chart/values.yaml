image:
  repository: localstack/localstack-pro
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

envFrom:
  - secretRef:
      name: localstack-secret

extraEnvVars:
  - name: LOCALSTACK_HOST
    value: "localstack.hoangvu75.space:443"
  - name: DISABLE_CORS_HEADERS
    value: "1"

service:
  type: ClusterIP
  edgeService:
    name: edge
    targetPort: 4566

persistence:
  enabled: true

mountDind:
  enabled: true
  forceTLS: false
  image: public.ecr.aws/docker/library/docker:24-dind

lambda:
  executor: docker

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 4Gi

tests:
  enabled: false
