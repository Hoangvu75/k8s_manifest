apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: helm-application
  repo: oci://ghcr.io/hoangvu75/helm_application
  releaseName: argocd-ingress
  namespace: argocd
  version: 6.16.1
  valuesFile: values.yaml
  additionalValuesFiles:
    - values-ingress.yaml

resources:
  - httproute-argocd.yaml
  - argocd-nodeport.yaml
