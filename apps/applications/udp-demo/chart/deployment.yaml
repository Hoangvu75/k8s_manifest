apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo
  namespace: udp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-echo
  template:
    metadata:
      labels:
        app: udp-echo
    spec:
      containers:
      - name: socat
        image: alpine/socat:latest
        args: ["-dd", "UDP-LISTEN:7778,fork,reuseaddr", "EXEC:cat"]
        ports:
        - containerPort: 7778
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
