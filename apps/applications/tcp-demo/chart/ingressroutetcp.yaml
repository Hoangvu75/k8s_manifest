# Routes TCP traffic from Traefik entryPoint "tcp" (port 9000 / NodePort 30900)
# to the tcp-echo service.
#
# Test with: nc <node-ip> 30900
# Everything you type is echoed back.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: tcp-echo
  namespace: tcp-demo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: tcp-echo
          port: 7777
