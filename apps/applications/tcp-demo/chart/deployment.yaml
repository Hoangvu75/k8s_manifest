apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-echo
  namespace: tcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-echo
  template:
    metadata:
      labels:
        app: tcp-echo
    spec:
      containers:
      - name: socat
        image: alpine/socat:latest
        args: ["-dd", "TCP-LISTEN:7777,fork,reuseaddr", "EXEC:cat,bindstderr"]
        ports:
        - containerPort: 7777
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
