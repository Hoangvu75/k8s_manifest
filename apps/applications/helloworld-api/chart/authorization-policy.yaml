# === Bịt lỗ bypass Kong ===
# Chỉ danh tính của Kong (ServiceAccount "kong" trong ns kong-gateway) mới được gọi helloworld-api.
# Mọi nguồn khác (vd pod cluster-check gọi thẳng helloworld-api:5678) sẽ bị sidecar Envoy CHẶN (403).
#
# Điều kiện tiên quyết (đã set ở cluster-resources/default/namespace.yaml + CẦN restart pod để tiêm sidecar):
#   - helloworld-api: istio-injection=enabled  -> sidecar enforce authz cho pod này
#   - kong-gateway:   istio-injection=enabled  -> Kong có danh tính mTLS để được ALLOW
#
# Luật theo IDENTITY (principal). Vì action ALLOW: chỉ nguồn khớp mới qua, còn lại deny hết.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: helloworld-api-allow-kong-only
  namespace: helloworld-api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/kong-gateway/sa/kong"
