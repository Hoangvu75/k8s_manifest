apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: helloworld-api-allow-kong-only
  namespace: helloworld-api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/kong-gateway/sa/kong"
