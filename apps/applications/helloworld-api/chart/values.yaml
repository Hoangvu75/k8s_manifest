applicationName: helloworld-api

deployment:
  enabled: true
  replicas: 1
  image:
    repository: hashicorp/http-echo
    tag: "1.0"
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 5678
  args:
    - -text="Hello World"
    - -listen=:5678
  resources:
    limits:
      cpu: 50m
      memory: 32Mi
    requests:
      cpu: 10m
      memory: 16Mi
