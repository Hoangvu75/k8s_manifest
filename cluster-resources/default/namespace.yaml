  name: helloworld-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    routing.hoangvu75.space/expose: "true"
    # Bật tiêm sidecar Istio (cần restart pod để sidecar được tiêm).
    istio-injection: enabled
---
