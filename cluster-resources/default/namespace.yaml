---
apiVersion: v1
kind: Namespace
metadata:
  name: kong-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    routing.hoangvu75.space/expose: "true"
    # Kong phải trong mesh thì traffic Kong->helloworld-api mới mang danh tính (SPIFFE) để policy nhận diện.
    # PERMISSIVE mTLS nên Traefik (ngoài mesh) vẫn gọi Kong bình thường. Cần restart pod Kong để tiêm sidecar.
    istio-injection: enabled
