apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    routing.hoangvu75.space/expose: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
