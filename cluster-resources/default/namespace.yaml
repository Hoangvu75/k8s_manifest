# Istio control plane (istiod). Sidecar mode -> không cần ztunnel/istio-cni. Không expose ra ngoài.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Namespace demo để học Istio (sidecar mode).
#  - istio-injection: enabled  -> pod tạo mới được tiêm Envoy sidecar (pod cũ phải restart mới có).
#  - routing.hoangvu75.space/expose -> cho phép Gateway nhận HTTPRoute từ ns này (nếu cần).
apiVersion: v1
kind: Namespace
metadata:
  name: istio-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    istio-injection: enabled
    routing.hoangvu75.space/expose: "true"
