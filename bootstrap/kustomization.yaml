apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../components/repo-url

resources:
  - root.yaml
  - cluster-resources.yaml
  - secrets.yaml

replacements:
  - source:
      kind: ConfigMap
      name: repo-config
      fieldPath: data.url
    targets:
      - select:
          kind: Application
          name: root
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: ApplicationSet
          name: cluster-resources
        fieldPaths:
          - spec.template.spec.source.repoURL
  - source:
      kind: ConfigMap
      name: repo-config
      fieldPath: data.secrets_url
    targets:
      - select:
          kind: Application
          name: secrets
        fieldPaths:
          - spec.source.repoURL
  - source:
      kind: ConfigMap
      name: repo-config
      fieldPath: data.manifest_revision
    targets:
      - select:
          kind: Application
          name: root
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: ApplicationSet
          name: cluster-resources
        fieldPaths:
          - spec.template.spec.source.targetRevision
  - source:
      kind: ConfigMap
      name: repo-config
      fieldPath: data.secrets_revision
    targets:
      - select:
          kind: Application
          name: secrets
        fieldPaths:
          - spec.source.targetRevision
