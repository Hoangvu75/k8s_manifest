apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Standard defaults for all HTTPRoutes in the cluster.
# Include this component in any kustomization that contains HTTPRoute resources.
#
# What it does:
#   - Ensures parentRefs[0] always references shared-gateway in gateway-api ns
#   - Adds the routing.hoangvu75.space/managed annotation for tooling visibility
#
# Usage in any kustomization.yaml:
#   components:
#     - ../../../components/httproute-defaults

patches:
  # Strategic merge — matches by parentRef "name" key.
  # If a route already has parentRef name=shared-gateway, this merges namespace.
  # If parentRef is missing, this adds it with correct namespace.
  - target:
      kind: HTTPRoute
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: ""
        annotations:
          routing.hoangvu75.space/managed: "true"
      spec:
        parentRefs:
          - name: shared-gateway
            namespace: gateway-api
